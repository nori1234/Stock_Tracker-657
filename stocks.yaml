# 株価通知の設定
#
# LINE Messaging API の push を使う (LINE Notify は 2025-03 で終了済み)。
# 機密値 (トークン・送信先) は空のままにして環境変数で渡すのを推奨:
#   LINE_CHANNEL_ACCESS_TOKEN, LINE_TO  (.env.example 参照)
line:
  channel_access_token: ""   # 空なら環境変数 LINE_CHANNEL_ACCESS_TOKEN
  to: ""                     # 送信先 userId/groupId。空なら環境変数 LINE_TO

# 監視銘柄。symbol は yfinance 形式:
#   日本株 … 証券コード + ".T"  (例: 7203.T = トヨタ自動車)
#   米国株 … ティッカー         (例: AAPL)
#
# conditions の type:
#   price_above       現在値 >= value
#   price_below       現在値 <= value
#   change_pct_above  前日比(%) >= value
#   change_pct_below  前日比(%) <= value
#   volume_above      出来高 >= value
#   near_year_high    52週高値の value% 以内まで上昇
#   near_year_low     52週安値の value% 以内まで下落
#   above_ma50 / below_ma50     現在値 と 50日移動平均 を比較 (value 不要)
#   above_ma200 / below_ma200   現在値 と 200日移動平均 を比較 (value 不要)
watchlist:
  - symbol: "7203.T"
    name: "トヨタ自動車"
    conditions:
      - type: price_above
        value: 3500
      - type: price_below
        value: 2500
      - type: change_pct_below
        value: -3
      - type: below_ma50          # 50日線割れ (value 不要)

  - symbol: "AAPL"
    name: "Apple"
    conditions:
      - type: change_pct_above
        value: 5
      - type: near_year_high      # 52週高値の3%以内
        value: 3
