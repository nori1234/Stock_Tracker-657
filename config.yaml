brain:
  provider: ollama            # "ollama" | "anthropic" | "stub"
  model: qwen3:4b             # ollama: モデルタグ / anthropic: 例 claude-sonnet-4-6
  base_url: http://localhost:11434
  temperature: 0.3
  num_ctx: 8192
  timeout: 120

retrieval:
  enabled: true
  storage_dir: ./storage
  top_k: 4
  embedder: hashing           # "hashing"(オフライン) | "ollama"(要embeddingモデル)
  embedding_dim: 512

memory:
  enabled: true
  provider: local             # "local"(JSON永続化) | "letta"(要Lettaサーバー)
  storage_dir: ./storage
  top_k: 5
  letta_base_url: http://localhost:8283
  letta_agent_id: ""

meeting:
  language: ja
  verbose: false
  max_iter: 3

output:
  save_to_file: true
  output_dir: ./outputs
