name: Stock LINE Notify

# 株価を定期取得し、条件成立時に LINE へ通知する。
# LINE の認証情報はリポジトリの Secrets に登録すること:
#   Settings → Secrets and variables → Actions
#     LINE_CHANNEL_ACCESS_TOKEN
#     LINE_TO
on:
  schedule:
    # GitHub Actions の cron は UTC。高負荷時は数分遅延することがある。
    - cron: "*/30 0-6 * * 1-5"    # 日本市場: JST 9:00-15:30 を 30 分毎 (月-金)
    - cron: "*/30 14-21 * * 1-5"  # 米国市場: ET 9:30-17:00 ごろを 30 分毎 (月-金)
  workflow_dispatch:              # 手動実行 (動作確認用)
    inputs:
      dry_run:
        description: "LINE 送信せず、取得値と本文だけ確認する"
        type: boolean
        default: false

# 同時実行を防ぎ、状態ファイルの競合を避ける
concurrency:
  group: stock-notify
  cancel-in-progress: false

# 最小権限: このワークフローはリポジトリを読むだけ (push/PR 操作はしない)
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets を job の env に載せ、未設定なら実行ステップをスキップして
    # ジョブを成功扱いにする (未設定のまま定期実行しても失敗メールが飛ばない)。
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # board 融合を使う場合のみ
    steps:
      - name: Checkout
        # SHA でピン留め (サプライチェーン対策)。コメントはバージョン。
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      # 既定は通知のみ (軽量)。AI 取締役会との融合 (stocks.yaml の board.enabled)
      # を Actions で使う場合は requirements.txt (crewai を含む) に切り替え、
      # board.provider: anthropic + ANTHROPIC_API_KEY Secret を設定すること。
      - name: Install dependencies
        run: pip install -r requirements-stock.txt

      # 重複抑制の状態を run 間で持ち越す。run_id を含む一意キーで毎回保存し、
      # restore-keys のプレフィックスで直近の状態を復元する。
      - name: Restore alert state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: storage
          key: stock-alert-state-${{ github.run_id }}
          restore-keys: |
            stock-alert-state-

      # Secrets 未設定ならスキップ (ジョブは成功)。設定されていれば実行する。
      # 定期実行では --notify-errors を付けない: Yahoo 側の一時障害でも
      # LINE にエラーを連投しないようにする (取得失敗は Actions ログで確認)。
      - name: Run stock notifier
        if: ${{ env.LINE_CHANNEL_ACCESS_TOKEN != '' && env.LINE_TO != '' }}
        run: |
          python stock_notify.py \
            --cooldown-minutes 180 \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
